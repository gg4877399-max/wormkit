name: Android Emulator Boot Test

on:
  push:
    branches: [emulator-test]
  workflow_dispatch:

jobs:
  boot-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Boot emulator and install PUBG
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_7
          script: |
            adb shell pm list packages | grep -i "vending\|gms" || true
            bash install-pubg.sh
