name: Android Emulator Boot Test

on:
  push:
    branches: [emulator-test]
  workflow_dispatch:

jobs:
  boot-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Boot emulator and install PUBG
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_7
          script: |
            set +e
            echo "=== Check Play Store presence ==="
            adb shell pm list packages | grep -i "vending\|gms" || true
            echo "=== Try APKPure direct link ==="
            curl -L -A "Mozilla/5.0 (Linux; Android 10; Pixel 7) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Mobile Safari/537.36" "https://d.apkpure.com/b/APK/com.tencent.ig?version=latest" -o pubg.bin --max-time 900
            ls -lh pubg.bin
            file pubg.bin
            if file pubg.bin | grep -qi "html"; then
              echo "APKPure blocked, trying official PUBG link"
              curl -L -A "Mozilla/5.0 (Linux; Android 10; Pixel 7) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Mobile Safari/537.36" "https://pubgmobile.live/apk" -o pubg.bin --max-time 900
              ls -lh pubg.bin
              file pubg.bin
            fi
            echo "=== Install ==="
            if file pubg.bin | grep -qi "zip"; then
              mkdir -p pubg_pkg
              unzip -o pubg.bin -d pubg_pkg || true
              ls pubg_pkg/ || true
              INNER=$(ls pubg_pkg/*.apk 2>/dev/null | head -1)
              if [ -n "$INNER" ]; then
                echo "XAPK inner APK: $INNER"
                adb install -r "$INNER" || adb install "$INNER" || true
                if [ -d pubg_pkg/Android/obb ]; then adb push pubg_pkg/Android/obb /sdcard/Android/ || true; fi
              else
                echo "Plain APK file, installing directly"
                adb install -r pubg.bin || adb install pubg.bin || true
              fi
            else
              echo "Download did not produce a valid APK, aborting install"
            fi
            echo "=== Launch PUBG ==="
            adb shell monkey -p com.tencent.ig -c android.intent.category.LAUNCHER 1 || true
            sleep 30
            echo "=== Check process ==="
            adb shell pidof com.tencent.ig || adb shell ps | grep tencent || true
            adb shell dumpsys window windows | grep -i mCurrentFocus | head -5 || true
